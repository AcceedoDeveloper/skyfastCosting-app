<div class="main">
 <div class="header">
 <h2>Raw Materials</h2>
<button mat-raised-button color="primary" id="hbtn" (click)="addrawmaterial()">
  <mat-icon class="btn-add-icon">add_box</mat-icon>
  <span>Add raw Material</span>
</button>
 </div>
 
  <!-- Show when data is loading -->
  <ng-container  *ngIf="rawMaterials$ | async as rawMaterials; else loading">
  
    <div class="table-container">
      <table  class="table table-bordered">
        <thead>
          <tr>
            <th>
              <div class="header-cell-content">
                <mat-icon class="header-icon">inventory_2</mat-icon>
                <span>Grade Name</span>
              </div>
            </th>
            <th>
              <div class="header-cell-content">
                <mat-icon class="header-icon">scale</mat-icon>
                <span>Rate Per Kg</span>
              </div>
            </th>
            <th>
              <div class="header-cell-content">
                <mat-icon class="header-icon">tune</mat-icon>
                <span>Actions</span>
              </div>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let rm of paginatedRawMaterials" class="table-row">
            <td>
              <div class="cell-content">
                <span>{{ rm.GradeName }}</span>
              </div>
            </td>
            <td>
              <div class="cell-content">
                <span class="rate-value">₹{{ rm.RatePerKg }}</span>
              </div>
            </td>
            <td class="actions">
              <div class="actions-container">
                <button mat-icon-button class="action-btn edit-btn" (click)="edit(rm)" title="Edit">
                  <mat-icon class="icon">edit</mat-icon>
                </button>
                <button mat-icon-button class="action-btn delete-btn" (click)="delete(rm._id)" title="Delete">
                  <mat-icon class="icon">delete</mat-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Paginator -->
      <mat-paginator 
        [length]="totalItems"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="currentPage"
        (page)="onPageChange($event)"
        showFirstLastButtons
        class="custom-paginator">
      </mat-paginator>
    </div>
  
  </ng-container>

  <!-- Fallback template -->
  <ng-template #loading>
    <p>Loading raw materials...</p>
  </ng-template>
</div>



<div class="popup" *ngIf=" popup" >

  <div class="popup-content">
    <h2 mat-dialog-title>Add Raw Material</h2>
    

<form [formGroup]="rawMaterialForm" (ngSubmit)=" onSubmit()" class="form-container">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Grade Name</mat-label>
    <input matInput formControlName="GradeName" placeholder="Enter Grade Name">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Rate Per Kg</mat-label>
    <input matInput type="number" formControlName="RatePerKg" placeholder="Enter Rate">
  </mat-form-field>



  <div class="actions">
   
    <button class="btn btn-danger" type="button" (click)="close()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Save</button>
  </div>
</form>

  </div>

</div>
