<h2 mat-dialog-title>{{ isEditMode ? 'Edit Process' : 'Add Process' }}</h2>

<form [formGroup]="processForm" (ngSubmit)="onSave()" class="form-container">

  <div class="first">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Process Name</mat-label>
      <input matInput formControlName="processName">
    </mat-form-field>
  
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tonnage / Jaw</mat-label>
      <input matInput formControlName="TonnageJaw">
    </mat-form-field>
  </div>

  <div class="sec">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Cost Per Hr</mat-label>
      <input matInput formControlName="Hours">
    </mat-form-field>  


    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Cycle Time / Weight</mat-label>
      <input matInput formControlName="cycleTime">
    </mat-form-field>
  
    <!-- Process Cost Display -->
    <!-- <div class="cost-display-box">
      <h5>Process Cost</h5>
      <div class="cost-value">
        ₹{{ calculateProcessCost() }}/Hour
      </div>
    </div> -->
    
  </div>




  <div class="actions">
    <button class="btn btn-danger" type="button" (click)="onCancel()">Cancel</button>
    <button class="submit-button" type="submit">{{ isEditMode ? 'Update' : 'Save' }}</button>
  </div>
</form>
