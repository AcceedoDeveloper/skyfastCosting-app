<h2 mat-dialog-title>{{ isEditMode ? 'Edit Process' : 'Add Process' }}</h2>

<form [formGroup]="processForm" (ngSubmit)="onSave()" class="form-container">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Process Name</mat-label>
    <input matInput formControlName="processName">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Tonnage Jaw</mat-label>
    <input matInput formControlName="TonnageJaw">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Hours</mat-label>
    <input matInput formControlName="Hours">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Cavity</mat-label>
    <input matInput type="number" formControlName="cavity">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Cycle Time</mat-label>
    <input matInput formControlName="cycleTime">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Cost</mat-label>
    <input matInput type="number" formControlName="cost">
  </mat-form-field>

  <div class="actions">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">{{ isEditMode ? 'Update' : 'Save' }}</button>
  </div>
</form>
