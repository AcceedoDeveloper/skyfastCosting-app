<div class="process-container">
  <div class="header">
    <div class="header-item">
      <h2 style="font-weight: bold;">Process List</h2>
    </div>

    <div class="header-item">
      <div class="search-input">
        <input type="text" placeholder="Search Process Name" [(ngModel)]="searchTerm" (input)="applyFilter()" />
        <button type="button" class="clear-btn" *ngIf="searchTerm" (click)="searchTerm=''; applyFilter()">✕</button>
        <mat-icon class="search-icon">search</mat-icon>
      </div>
    </div>

    <div class="header-item">
      <div class="file-upload-container">
        <input class="file-upload-container-input" type="file" (change)="onFileSelected($event)" />
        <button type="button" class="btn btn-secondary" (click)="onUpload()">Upload</button>
      </div>
    </div>

    <div class="header-item">
      <button mat-raised-button color="primary" id="hbtn" (click)="openAddDialog()">+ Add Process</button>
    </div>
  </div>


 <ng-container *ngIf="allProcesses.length ; ">
  <div class="table-container">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Process Name</th>
          <th>Tonnage / Jaw</th>
          <th>Cost Per Hr</th>
          <th>Machine Centre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of paginatedUsers">
          <td>{{ p.processName }}</td>
          <td>{{ p.TonnageJaw }}</td>
          <td>{{ p.Hours }}</td>
          <td>{{ p.machineCentre }}</td>
          <td class="actions">
            <mat-icon class="icon" (click)="openEditDialog(p)">edit</mat-icon>
            <mat-icon class="icon" (click)="onDelete(p._id)">delete</mat-icon>
          </td>
        </tr>
      </tbody>
    </table>

    <mat-paginator
      [length]="filteredProcesses.length"
      [pageSize]="pageSize"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons
      class="custom-paginator">
    </mat-paginator>
  </div>
</ng-container>



</div>
