
<div class="main">


  <div class="header">
    <h2>Roles</h2>
  
    <div class="add-section">
      <div class="input-wrapper">
        <mat-icon class="input-icon">badge</mat-icon>
        <input
          type="text"
          placeholder="Enter role name"
          [(ngModel)]="newRoleName"
          class="role-input"
          autocomplete="off"
          (focus)="onInputFocus()"
          (blur)="onInputBlur()"
          [class.focused]="inputFocused"
        />
        <div class="input-underline" [class.active]="inputFocused || newRoleName.length > 0"></div>
      </div>
  
      <button
        mat-raised-button
        color="primary"
        (click)="isEditMode ? updateRole() : addRole()"
        [disabled]="newRoleName.trim().length === 0"
        class="circular-button primary-button"
        [class.pulse]="!isEditMode && newRoleName.trim().length > 0"
      >
        <mat-icon class="btn-icon">{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      </button>
  
      <button
        *ngIf="isEditMode"
        class="btn btn-danger cancel-btn"
        (click)="cancelEdit()"
      >
        Cancel
      </button>
    </div>
  </div>
  
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>
            <div class="header-cell-content">
              <mat-icon class="header-icon">admin_panel_settings</mat-icon>
              <span>Role</span>
            </div>
          </th>
          <th>
            <div class="header-cell-content">
              <mat-icon class="header-icon">tune</mat-icon>
              <span>Actions</span>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr class="table-row" *ngFor="let role of roles$ | async; let i = index">
          <td>
            <div class="cell-content">
              <span class="role-name">{{ role.role }}</span>
            </div>
          </td>
          <td class="actions">
            <div class="actions-container">
              <button mat-icon-button class="action-btn edit-btn" (click)="editRole(role)" [disabled]="isAdminRole(role)" title="Edit">
                <mat-icon class="icon">{{ isAdminRole(role) ? 'lock' : 'edit' }}</mat-icon>
              </button>
              <button mat-icon-button class="action-btn delete-btn" (click)="deleteRole(role._id)" [disabled]="isAdminRole(role)" title="Delete">
                <mat-icon class="icon">{{ isAdminRole(role) ? 'lock' : 'delete' }}</mat-icon>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="(roles$ | async)?.length === 0">
          <td colspan="2" class="no-data">No roles found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
