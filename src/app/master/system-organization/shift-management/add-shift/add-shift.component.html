<form [formGroup]="shiftForm" (ngSubmit)="onSubmit()" class="form-container">
  <h2 mat-dialog-title>Add Shift</h2>

  <!-- //shift -->
   <!-- <mat-form-field appearance="outline" class="full-width"> -->
 <mat-label>Shift Name</mat-label>
 <input formControlName="shiftName" placeholder="Enter shift name" >
<!-- </mat-form-field> -->


<div class="times">

  <!-- <mat-form-field appearance="outline" class="full-width"> -->
    <div class="st">
      <div>
        <mat-label >Start Time</mat-label>

      </div>
      <div>

        <input   formControlName="startTime" placeholder="Select shift Start Time"  [ngxTimepicker]="startTime">
        <ngx-material-timepicker #startTime></ngx-material-timepicker>
      </div>


    </div>

  <!-- </mat-form-field> -->

<div>
<div class="et">
  <mat-label class="et">End Time</mat-label>

</div>
<div>

  <input  formControlName="endTime" placeholder="Select  shift End Time" [ngxTimepicker]="endtime">
  <ngx-material-timepicker #endtime></ngx-material-timepicker>
</div>
</div>
  <!-- <mat-form-field appearance="outline" class="full-width"> -->
  <!-- </mat-form-field> -->

</div>




 <div class="actions">
   <button class="btn btn-danger" type="button" (click)="onCancel()">Cancel</button>
    <button class="submit-button"   type="submit" [disabled]="shiftForm.invalid">Save</button>
  </div>
</form>
