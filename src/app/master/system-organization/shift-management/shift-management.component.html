

<div class="main">

  <div class="headers">
    <h2>Shift</h2>
    <button mat-raised-button color="primary" id="hbtn" (click)="openAddShift()">
      <mat-icon class="btn-add-icon">schedule</mat-icon>
      Add Shift
    </button>
  </div>
  
  <!-- Shift Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>
            <div class="header-cell-content">
              <mat-icon class="header-icon">schedule</mat-icon>
              <span>Shift Name</span>
            </div>
          </th>
          <th>
            <div class="header-cell-content">
              <mat-icon class="header-icon">access_time</mat-icon>
              <span>Start Time</span>
            </div>
          </th>
          <th>
            <div class="header-cell-content">
              <mat-icon class="header-icon">access_time</mat-icon>
              <span>End Time</span>
            </div>
          </th>
          <th>
            <div class="header-cell-content">
              <mat-icon class="header-icon">timer</mat-icon>
              <span>Hours</span>
            </div>
          </th>
          <th>
            <div class="header-cell-content">
              <mat-icon class="header-icon">tune</mat-icon>
              <span>Actions</span>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr class="table-row" *ngFor="let shift of shift$ | async; let i = index">
          <td>
            <div class="cell-content">
              <span class="shift-name">{{ shift.shiftName }}</span>
            </div>
          </td>
          <td>
            <div class="cell-content">
              <span class="time-value">{{ shift.startTime }}</span>
            </div>
          </td>
          <td>
            <div class="cell-content">
              <span class="time-value">{{ shift.endTime }}</span>
            </div>
          </td>
          <td>
            <div class="cell-content">
              <span class="hours-value">{{ getShiftHours(shift) }}</span>
            </div>
          </td>
          <td class="actions">
            <div class="actions-container">
              <button mat-icon-button class="action-btn edit-btn" (click)="editShift(shift)" title="Edit">
                <mat-icon class="icon">edit</mat-icon>
              </button>
              <button mat-icon-button class="action-btn delete-btn" (click)="deleteShift(shift._id)" title="Delete">
                <mat-icon class="icon">delete</mat-icon>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td></td>
          <td></td>
          <td></td>
          <td class="total-hours-cell">
            <div class="total-content">
              <mat-icon class="total-icon">summarize</mat-icon>
              <span class="total-label-text">Total Hours</span>
              <span class="total-value">{{ totalHours }}</span>
            </div>
          </td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
