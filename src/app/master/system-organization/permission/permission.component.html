<div class="machine-type-container">
  <!-- Header -->
  <div class="header">
    <h2>Permission</h2>
    <button mat-raised-button color="primary" (click)="toggleForm()">
      <mat-icon>add</mat-icon> Add Permission
    </button>
  </div>

  <!-- Popup Form -->
  <div *ngIf="showForm" class="popup-overlay">
    <div class="popup">
      <h3>{{ existingPermissionId ? 'Edit Permission' : 'Add Permission' }}</h3>
      <button class="close-btn" (click)="showForm = false">&times;</button>

      <!-- Select Role -->
      <form>
        <label for="role">Select Role</label>
        <select id="role" [(ngModel)]="selectedRole" name="role" (ngModelChange)="onRoleChange()">
          <option *ngFor="let role of roles$ | async" [ngValue]="role._id">{{ role.role }}</option>
        </select>
      </form>

      <!-- Initial Screen -->
      <div *ngIf="selectedRole" class="initial-screen">
        <label for="initialScreen">Initial Screen</label>
        <select id="initialScreen" [(ngModel)]="initialScreen" name="initialScreen">
          <option value="dashboard">Dashboard</option>
          <option value="user">User Management</option>
          <option value="company">Company Management</option>
          <option value="material">Material & Process Management</option>
          <option value="quotation">Quotation Generator</option>
          <option value="reports">Reports</option>
        </select>
      </div>

      <!-- Permissions Checkboxes -->
      <ul class="nav-list">
        <!-- Dashboard -->
        <li class="nav-item">
          <div class="nav-item-content">
            <input type="checkbox" id="dashboard" [(ngModel)]="permissions.dashboard" name="dashboard" />
            <label for="dashboard" class="nav-text">Dashboard</label>
          </div>
        </li>

        <!-- User Management -->
        <li class="nav-item has-submenu">
          <div class="nav-item-content">
            <input type="checkbox" id="userParent" [(ngModel)]="permissions.user.parent" name="userParent"
              (change)="toggleGroup('user')" />
            <label for="userParent" class="nav-text">User Management</label>
          </div>
          <ul class="submenu">
            <li *ngFor="let item of userSubItems">
              <input type="checkbox" [id]="'user-' + item.key" [(ngModel)]="permissions.user.children[item.key]"
                [name]="'user-' + item.key" (change)="checkParent('user')" />
              <label [for]="'user-' + item.key">{{ item.label }}</label>
            </li>
          </ul>
        </li>

        <!-- Company Management -->
        <li class="nav-item has-submenu">
          <div class="nav-item-content">
            <input type="checkbox" id="companyParent" [(ngModel)]="permissions.company.parent" name="companyParent"
              (change)="toggleGroup('company')" />
            <label for="companyParent" class="nav-text">Company Management</label>
          </div>
          <ul class="submenu">
            <li *ngFor="let item of companySubItems">
              <input type="checkbox" [id]="'company-' + item.key" [(ngModel)]="permissions.company.children[item.key]"
                [name]="'company-' + item.key" (change)="checkParent('company')" />
              <label [for]="'company-' + item.key">{{ item.label }}</label>
            </li>
          </ul>
        </li>

        <!-- Material & Process Management -->
        <li class="nav-item has-submenu">
          <div class="nav-item-content">
            <input type="checkbox" id="materialParent" [(ngModel)]="permissions.material.parent" name="materialParent"
              (change)="toggleGroup('material')" />
            <label for="materialParent" class="nav-text">Material & Process Management</label>
          </div>
          <ul class="submenu">
            <li *ngFor="let item of materialSubItems">
              <input type="checkbox" [id]="'material-' + item.key" [(ngModel)]="permissions.material.children[item.key]"
                [name]="'material-' + item.key" (change)="checkParent('material')" />
              <label [for]="'material-' + item.key">{{ item.label }}</label>
            </li>
          </ul>
        </li>

        <!-- Quotation -->
        <li class="nav-item">
          <div class="nav-item-content">
            <input type="checkbox" id="quotation" [(ngModel)]="permissions.quotation" name="quotation" />
            <label for="quotation" class="nav-text">Quotation Generator</label>
          </div>
        </li>

        <!-- Reports -->
        <li class="nav-item">
          <div class="nav-item-content">
            <input type="checkbox" id="reports" [(ngModel)]="permissions.reports" name="reports" />
            <label for="reports" class="nav-text">Reports</label>
          </div>
        </li>
      </ul>

      <!-- Save Button -->
      <div class="form-actions">
        <button mat-raised-button color="primary" (click)="savePermission()">
          {{ existingPermissionId ? 'Update Permission' : 'Save Permission' }}
        </button>
      </div>
    </div>
  </div>
</div>
